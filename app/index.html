<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>이야기 공방</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">▧</span><div>이야기 공방<small>STORY FORGE · 0.3</small></div></div><input id="projectName" aria-label="프로젝트 이름"><span id="saveState">예제 프로젝트</span><nav><button id="newProject">새 프로젝트</button><button id="openProject">열기</button><button id="saveProject">저장 <kbd>Ctrl S</kbd></button><button id="saveAs" title="다른 이름으로 저장">다른 이름</button><button id="exportGame">게임 내보내기</button><button id="updates">업데이트</button><button class="primary" id="play">▶ 플레이 <kbd>F5</kbd></button></nav></header>
<main><aside class="left"><section><div class="sectionTitle">프로젝트 맵 <button id="addMap" title="맵 추가">＋</button></div><div id="mapList"></div><button class="quiet wide" id="mapSettings">현재 맵 설정</button></section><section class="assetSection"><div class="sectionTitle">그림과 타일 <button id="importAsset">＋ 불러오기</button></div><div class="tabs"><button class="active" data-tab="tile">타일</button><button data-tab="character">캐릭터</button><button data-tab="other">기타</button></div><div id="palette"></div><div id="assetInfo" class="hint"></div></section><section class="guide"><strong>작은 마을에서 시작해요</strong><p>타일을 고르고 맵에 드래그하세요.<br>이벤트 도구로 사람과 이야기를 놓으세요.</p><button id="help">사용 방법 · 단축키</button></section></aside>
<div class="workspace"><div class="toolbar"><div id="tools"><button data-tool="brush" class="active" title="B">붓</button><button data-tool="fill" title="F">채우기</button><button data-tool="erase" title="E">지우개</button><button data-tool="event" title="V">이벤트</button><button data-tool="start">시작 위치</button></div><span class="divider"></span><select id="layer" aria-label="편집 레이어"><option value="ground">바닥</option><option value="objects">장식</option><option value="collision">통행 설정</option></select><button id="undo" title="Ctrl Z">↶</button><button id="redo" title="Ctrl Y">↷</button><label class="check"><input id="grid" type="checkbox" checked>격자</label><select id="zoom" aria-label="확대"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></div><div class="mapHeading"><div><small>MAP EDITOR</small><h1 id="mapTitle"></h1></div><span id="mapMeta"></span></div><div id="canvasWrap"><canvas id="mapCanvas" aria-label="맵 편집 영역"></canvas></div><footer><span id="cursorInfo">맵 위에 마우스를 올려보세요</span><span id="toolHint">왼쪽 버튼: 그리기 · 오른쪽 버튼: 타일 선택</span></footer></div>
<aside class="right"><div class="sectionTitle">이벤트와 속성 <span id="eventCount" class="badge"></span></div><div id="inspector"></div></aside></main>
<dialog id="modal"><div id="modalContent"></div></dialog>
<div id="playOverlay" hidden><div class="playHeader"><strong id="playTitle"></strong><span>방향키 / WASD 이동 · Enter / Space 대화 · I 가방</span><button id="inventory">가방</button><button id="restartPlay">처음부터</button><button id="stopPlay">편집기로 돌아가기 <kbd>Esc</kbd></button></div><div class="playStage"><div id="gameView"><canvas id="playCanvas"></canvas></div><div id="dialogue" hidden></div><div id="bag" hidden></div></div><div class="playFoot" id="playMapName"></div></div>
<div id="toast" role="status"></div><input id="assetFile" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="projectFile" type="file" accept=".storyforge,.json" hidden>
<script src="engine.js"></script><script src="action.js"></script><script src="player-style.js"></script><script src="player.js"></script><script src="editor.js"></script><script src="action-editor.js"></script></body></html>
